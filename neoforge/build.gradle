//     skip()
// }

publishing {
repositories {
repositories {
    maven {
        name = "CodebergPackages"
        url = "https://codeberg.org/api/packages/Mod-Sauce/maven"

        credentials {
            username = System.getenv("CODEBERG_USERNAME") ?: "shadowbee"
            password = System.getenv("PKGTOKEN") ?: ""
        }
    }
}


    publications {
        maven(MavenPublication) {
            from(components.java)
            groupId = "org.mod-sauce" // or whatever you want
            artifactId = "otyacraftenginerenewed-neoforge" // fabric, forge, or nothing
            version = rootProject.version
        }
    }
}
