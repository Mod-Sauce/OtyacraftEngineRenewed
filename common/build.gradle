architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/otyacraftenginerenewed.accesswidener")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}"
    implementation "dev.felnull:felnull-java-library:${rootProject.felnull_version}"
    implementation 'com.madgag:animated-gif-lib:1.4'

    compileOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"
}

publishing {
repositories {
    maven {
        name = "CodebergPackages"
        url = "https://codeberg.org/api/packages/Mod-Sauce/maven"

        credentials {
            username = System.getenv("CODEBERG_USERNAME") ?: "shadowbee"
            password = System.getenv("PKGTOKEN") ?: ""
        }
    }
}


    publications {
        maven(MavenPublication) {
            from(components.java)
            groupId = "org.mod-sauce" // or whatever you want
            artifactId = "otyacraftenginerenewed" // fabric, forge, or nothing
            version = rootProject.version
        }
    }
}
